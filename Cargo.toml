[package]
name = "strixctl"
version = "0.1.0"
edition = "2024"
default-run = "strixctl"

[dependencies]
iced = { version = "0.13", features = ["canvas", "tokio", "advanced", "image"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
zbus = { version = "4", features = ["tokio"], optional = true }

[features]
daemon = ["zbus"]

[[bin]]
name = "strixctld"
path = "src/bin/strixctld.rs"
required-features = ["daemon"]

[[bin]]
name = "strixctl-cpuctl"
path = "src/bin/strixctl_cpuctl.rs"
