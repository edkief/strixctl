[package]
name = "strixctl"
version = "0.1.0"
edition = "2024"
default-run = "strixctl"

[dependencies]
iced = { version = "0.13", features = ["canvas", "tokio", "advanced", "image"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Linux-only D-Bus daemon stack (opt-in via the `daemon` feature). Not pulled in
# on Windows, which never enables this feature.
[target.'cfg(unix)'.dependencies]
zbus = { version = "4", features = ["tokio"], optional = true }
futures-util = { version = "0.3", default-features = false, features = ["std"], optional = true }

# Windows: UAC elevation ("runas") for ryzenadj.exe and bcdedit via ShellExecuteEx.
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = [
    "Win32_UI_Shell",
    "Win32_System_Threading",
    "Win32_System_Registry",
    "Win32_Foundation",
] }

[features]
daemon = ["zbus", "futures-util"]
# Periodic PPT drift guard. Reads live PPT via `ryzenadj --info`, which pokes the
# Strix Halo SMU mailbox shared with amdgpu and can hard-lock the machine. Off by
# default; the platform-profile drift guard (SMU-safe) is always active.
ppt-drift-guard = []

[[bin]]
name = "strixctld"
path = "src/bin/strixctld.rs"
required-features = ["daemon"]

[[bin]]
name = "strixctl-cpuctl"
path = "src/bin/strixctl_cpuctl.rs"
