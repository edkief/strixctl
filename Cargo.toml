[package]
name = "strixctl"
version = "0.1.0"
edition = "2024"
default-run = "strixctl"

[dependencies]
eframe = "0.29"
egui = "0.29"
egui_plot = "0.29"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
zbus = { version = "4", features = ["tokio"], optional = true }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time"], optional = true }

[features]
daemon = ["zbus", "tokio"]

[[bin]]
name = "strixctld"
path = "src/bin/strixctld.rs"
required-features = ["daemon"]

[[bin]]
name = "strixctl-cpuctl"
path = "src/bin/strixctl_cpuctl.rs"
